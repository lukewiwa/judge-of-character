name: Build and lint

on:
  push:
    branches-ignore:
      - master

jobs:
  build-frontend:
    defaults:
      run:
        working-directory: src
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Use Node.js 22
        uses: actions/setup-node@v2
        with:
          node-version: "22"

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
